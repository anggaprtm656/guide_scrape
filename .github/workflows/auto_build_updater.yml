name: Auto Update HoYo Character Builds

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pukul 04:00 UTC (11:00 WIB)
    - cron: '0 4 */3 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - '.gitignore'

jobs:
  update-builds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Build Crawler Script
        run: |
          node build_crawler.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/builds.json
          if git diff --staged --quiet; then
            echo "Tidak ada build baru yang berubah. Skip commit."
          else
            git commit -m "Auto: Update character builds database [skip ci]"
            git push
          fi
